<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="jansetu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164DAA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- Base rounded container -->
  <rect width="64" height="64" rx="16" fill="url(#jansetu-grad)" />

  <!-- Subtle glow inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Civic Shield Outline -->
  <path
    d="M32 12 C39 15 47 17 47 27 C47 41.5 35 49.5 32 52 C29 49.5 17 41.5 17 27 C17 17 25 15 32 12 Z"
    fill="rgba(255, 255, 255, 0.12)"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Bridge "Setu" Arch -->
  <path
    d="M21 41 Q32 31 43 41"
    stroke="url(#accent-grad)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Verified Checkmark / Resolution Node -->
  <path
    d="M26 30.5 L30.5 35 L38.5 25"
    stroke="#FFFFFF"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Apex civic node -->
  <circle cx="32" cy="20" r="2.5" fill="#60A5FA" />
</svg>
